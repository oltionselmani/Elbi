<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="description" content="Elbi — your own streaming library.">
<title>Elbi</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/elbi.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/elbi-192.png">
<link rel="stylesheet" href="/css/elbi.css">
</head>
<body>

<!-- ── Sign in ─────────────────────────────────────────────────────────── -->
<div class="gate" id="loginGate" hidden>
  <form class="gate__card" id="loginForm">
    <div class="wordmark wordmark--lg">ELBI</div>
    <h1>Sign in</h1>
    <p class="muted">This library is password protected.</p>
    <label class="field">
      <span>Password</span>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </label>
    <p class="form-error" id="loginError" hidden></p>
    <button class="btn btn--primary btn--block" type="submit">Sign in</button>
  </form>
</div>

<!-- ── Who's watching ──────────────────────────────────────────────────── -->
<div class="gate" id="profileGate" hidden>
  <div class="gate__card gate__card--wide">
    <h1>Who's watching?</h1>
    <div class="profiles" id="profileList"></div>
    <button class="btn btn--ghost" id="manageProfilesBtn" type="button">Manage profiles</button>
  </div>
</div>

<!-- ── App ─────────────────────────────────────────────────────────────── -->
<div id="app" hidden>
  <header class="topbar" id="topbar">
    <a class="wordmark" href="/browse" data-route="/browse">ELBI</a>
    <nav class="topbar__nav">
      <a href="/browse" data-route="/browse" class="navlink">Home</a>
      <a href="/library" data-route="/library" class="navlink">My library</a>
      <a href="/discover" data-route="/discover" class="navlink">Free films</a>
    </nav>
    <div class="topbar__spacer"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.7 10.7l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
      <input type="search" id="searchInput" placeholder="Search titles, genres…" aria-label="Search" autocomplete="off">
    </div>
    <button class="btn btn--primary btn--sm" id="addBtn" type="button">+ Add</button>
    <button class="iconbtn" id="offlineBtn" type="button" title="Downloads" aria-label="Downloads">
      <svg viewBox="0 0 24 24" class="icon"><path d="M12 3v10.6l3.3-3.3 1.4 1.4L12 17.4l-4.7-4.7 1.4-1.4 3.3 3.3V3h2ZM5 19h14v2H5v-2Z"/></svg>
      <span class="badge" id="offlineCount" hidden>0</span>
    </button>
    <button class="avatar" id="profileBtn" type="button" aria-label="Profile"></button>
  </header>

  <main id="view" class="view"></main>

  <footer class="footer">
    <p>Elbi — your own library. Streams your files; public-domain titles come from the Internet Archive.</p>
    <p class="muted" id="footerStats"></p>
  </footer>
</div>

<!-- ── Detail sheet ────────────────────────────────────────────────────── -->
<div class="modal" id="detailModal" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="modal__panel modal__panel--detail" role="dialog" aria-modal="true" aria-label="Title details">
    <button class="modal__close" data-close aria-label="Close">&times;</button>
    <div id="detailBody"></div>
  </div>
</div>

<!-- ── Add / manage sheet ──────────────────────────────────────────────── -->
<div class="modal" id="addModal" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-label="Add to library">
    <button class="modal__close" data-close aria-label="Close">&times;</button>
    <div class="tabs" id="addTabs">
      <button class="tab is-active" data-tab="upload" type="button">Upload files</button>
      <button class="tab" data-tab="scan" type="button">Scan a folder</button>
      <button class="tab" data-tab="url" type="button">Add by URL</button>
      <button class="tab" data-tab="new" type="button">New title</button>
    </div>
    <div id="addBody"></div>
  </div>
</div>

<!-- ── Generic sheet (settings, downloads, profiles) ────────────────────── -->
<div class="modal" id="sheetModal" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-label="Panel">
    <button class="modal__close" data-close aria-label="Close">&times;</button>
    <div id="sheetBody"></div>
  </div>
</div>

<!-- ── Player ──────────────────────────────────────────────────────────── -->
<div class="player" id="player" hidden>
  <!-- No crossorigin attribute: subtitles are always same-origin via /api/subtitles,
       and forcing CORS mode would break every remote video whose host omits the header. -->
  <video id="video" playsinline preload="metadata"></video>

  <!-- double-tap seek zones -->
  <div class="player__zones">
    <div class="zone zone--left" data-zone="back"><div class="zone__ripple"><span class="zone__label"></span></div></div>
    <div class="zone zone--mid" data-zone="mid"></div>
    <div class="zone zone--right" data-zone="fwd"><div class="zone__ripple"><span class="zone__label"></span></div></div>
  </div>

  <div class="player__spinner" id="playerSpinner" hidden><span></span></div>

  <div class="player__toast" id="playerToast" hidden></div>

  <div class="player__error" id="playerError" hidden>
    <h3>Can't play this file</h3>
    <p id="playerErrorText"></p>
    <div class="row-gap">
      <button class="btn btn--ghost" id="playerErrorSwitch" type="button" hidden>Try another quality</button>
      <button class="btn btn--primary" id="playerErrorClose" type="button">Back</button>
    </div>
  </div>

  <div class="stats" id="statsPanel" hidden>
    <div class="stats__head">Stats for nerds <button class="iconbtn iconbtn--tiny" id="statsClose" aria-label="Hide stats">&times;</button></div>
    <dl id="statsBody"></dl>
  </div>

  <div class="player__ui" id="playerUi">
    <div class="player__top">
      <button class="iconbtn" id="playerBack" aria-label="Back">
        <svg viewBox="0 0 24 24" class="icon"><path d="M15.4 4.6 14 3.2 5.2 12l8.8 8.8 1.4-1.4L8 12l7.4-7.4Z"/></svg>
      </button>
      <div class="player__titles">
        <strong id="playerTitle"></strong>
        <span id="playerSubtitle" class="muted"></span>
      </div>
    </div>

    <div class="player__bottom">
      <div class="scrub" id="scrub">
        <div class="scrub__rail">
          <div class="scrub__buffer" id="scrubBuffer"></div>
          <div class="scrub__played" id="scrubPlayed"><span class="scrub__knob"></span></div>
        </div>
        <div class="scrub__tip" id="scrubTip" hidden>0:00</div>
        <input type="range" id="scrubInput" min="0" max="1000" value="0" step="1" aria-label="Seek">
      </div>

      <div class="controls">
        <button class="iconbtn" id="btnPlay" aria-label="Play/pause"></button>
        <button class="iconbtn" id="btnBack" aria-label="Rewind"></button>
        <button class="iconbtn" id="btnFwd" aria-label="Forward"></button>

        <div class="volume">
          <button class="iconbtn" id="btnMute" aria-label="Mute"></button>
          <input type="range" id="volInput" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        </div>

        <span class="time"><span id="timeNow">0:00</span> <span class="muted">/</span> <span id="timeTotal">0:00</span></span>

        <div class="controls__spacer"></div>

        <button class="btn btn--chip" id="btnNext" hidden>Next episode</button>

        <div class="menu" id="menuQuality">
          <button class="iconbtn" data-menu-toggle aria-label="Quality">
            <svg viewBox="0 0 24 24" class="icon"><path d="M4 6h16v2H4V6Zm0 5h16v2H4v-2Zm0 5h10v2H4v-2Z"/></svg>
            <span class="chiplabel" id="qualityLabel">Auto</span>
          </button>
          <div class="menu__panel" data-menu-panel hidden></div>
        </div>

        <div class="menu" id="menuSubs">
          <button class="iconbtn" data-menu-toggle aria-label="Subtitles">
            <svg viewBox="0 0 24 24" class="icon"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm3 8v2h6v-2H6Zm8 0v2h4v-2h-4ZM6 9v2h4V9H6Zm6 0v2h6V9h-6Z"/></svg>
          </button>
          <div class="menu__panel" data-menu-panel hidden></div>
        </div>

        <div class="menu" id="menuMore">
          <button class="iconbtn" data-menu-toggle aria-label="More options">
            <svg viewBox="0 0 24 24" class="icon"><path d="M12 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/></svg>
          </button>
          <div class="menu__panel" data-menu-panel hidden></div>
        </div>

        <button class="iconbtn" id="btnPip" aria-label="Picture in picture">
          <svg viewBox="0 0 24 24" class="icon"><path d="M3 5h18v14H3V5Zm2 2v10h14V7H5Zm7 4h6v5h-6v-5Z"/></svg>
        </button>
        <button class="iconbtn" id="btnFull" aria-label="Fullscreen"></button>
      </div>
    </div>
  </div>

  <div class="upnext" id="upnext" hidden>
    <div class="upnext__card">
      <span class="muted">Up next</span>
      <strong id="upnextTitle"></strong>
      <div class="row-gap">
        <button class="btn btn--primary" id="upnextPlay" type="button">Play now <span id="upnextCount"></span></button>
        <button class="btn btn--ghost" id="upnextCancel" type="button">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module" src="/js/app.js"></script>
<noscript><p style="color:#fff;padding:2rem">Elbi needs JavaScript to run.</p></noscript>
</body>
</html>
